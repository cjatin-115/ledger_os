[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for Ledger OS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]",
    "email-validator>=2.1.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.1.2",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
    "google-genai>=2.19.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ADD THIS SECTION BELOW:
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "alembic/versions",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["scratch"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
