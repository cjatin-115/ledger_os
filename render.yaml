services:
  - type: web
    name: ledgeros-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "cd services/api && pip install -r requirements.txt"
    startCommand: "cd services/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgeros-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: ledgeros-db
    databaseName: ledgeros
    user: ledgeros_user
    region: singapore
    plan: free
